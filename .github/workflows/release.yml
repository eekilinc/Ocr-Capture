name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: '--target x86_64-pc-windows-msvc --bundles nsis'
            rust-targets: 'x86_64-pc-windows-msvc'
          - platform: macos-latest
            args: '--target universal-apple-darwin'
            rust-targets: 'aarch64-apple-darwin,x86_64-apple-darwin'
          - platform: ubuntu-22.04
            args: ''
            rust-targets: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Depoyu çek
        uses: actions/checkout@v4

      # ── LINUX ────────────────────────────────────────────────────────────────
      - name: Linux sistem bağımlılıklarını kur
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            tesseract-ocr \
            tesseract-ocr-tur \
            tesseract-ocr-eng \
            pkg-config \
            libclang-dev \
            libssl-dev \
            libx11-dev \
            libxtst-dev \
            libxrandr-dev \
            libxcb1-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxcb-randr0-dev \
            libxcb-shm0-dev \
            libdbus-1-dev \
            libpipewire-0.3-dev \
            libwayland-dev \
            libegl-dev

      # ── MACOS ────────────────────────────────────────────────────────────────
      - name: macOS Tesseract kur
        if: matrix.platform == 'macos-latest'
        run: brew install tesseract tesseract-lang

      # ── WINDOWS ──────────────────────────────────────────────────────────────
      - name: Windows Tesseract kur (Chocolatey)
        if: matrix.platform == 'windows-latest'
        shell: powershell
        run: |
          choco install tesseract --yes
          $tessPath = "C:\Program Files\Tesseract-OCR"
          echo "$tessPath" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          echo "TESSERACT_PATH=$tessPath\tesseract.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Windows Türkçe dil paketini kur
        if: matrix.platform == 'windows-latest'
        shell: powershell
        run: |
          $tessdata = "C:\Program Files\Tesseract-OCR\tessdata"
          Invoke-WebRequest `
            -Uri "https://github.com/tesseract-ocr/tessdata/raw/main/tur.traineddata" `
            -OutFile "$tessdata\tur.traineddata"
          Invoke-WebRequest `
            -Uri "https://github.com/tesseract-ocr/tessdata/raw/main/eng.traineddata" `
            -OutFile "$tessdata\eng.traineddata"

      # ── NODE & RUST ──────────────────────────────────────────────────────────
      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'

      - name: Rust araç zincirini kur
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Rust önbelleği
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      # ── BUILD ────────────────────────────────────────────────────────────────
      - name: Frontend bağımlılıklarını yükle
        run: npm install

      - name: Uygulamayı derle ve Release oluştur
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUST_BACKTRACE: '1'
        with:
          tagName: ${{ github.ref_name }}
          releaseName: '⚡ Metin Yakalayıcı ${{ github.ref_name }}'
          releaseBody: |
            ## ⚡ Metin Yakalayıcı ${{ github.ref_name }}

            Masaüstü ekran alıntısı ve çevrimdışı OCR deneyimini en üst seviyeye taşıyan sürüm!

            ### 🌟 Öne Çıkan Yenilikler
            * 🎯 **İnteraktif Masaüstü Bölge Seçimi (`ScreenOverlay`):** Ekranı dondurup karartan, artı (crosshair) imleci ve anlık piksel cetveli ile doğrudan masaüstünde alan seçip tek tıkla metin ayıklama.
            * ⏱️ **Gecikmeli Ekran Yakalama (3s / 5s):** Açılır menüleri (dropdown) ve araç ipuçlarını (tooltip) yakalamak için geri sayım sayacı ve ses efektleri.
            * 📊 **Tablo & Yapılandırılmış Veri OCR:** Kelime koordinatlarını analiz ederek doğrudan **Excel (TSV)** veya **Markdown Tablosu** formatında hücre hücre kopyalama.
            * 🌐 **Tek Tıkla Google Araması:** Ayıklanan metni varsayılan web tarayıcısında anında arama.
            * 🔎 **Metin İçi Bul ve Değiştir:** Anlık kelime arama, canlı eşleşme sayacı, tekil ve toplu ("Tümünü Değiştir") düzenleme.
            * 🎨 **Yeni Neon Glassmorphic Tasarım:** Yüksek çözünürlüklü yeni uygulama ikonu ve neon auralı "Hakkında" sekmesi.

            ### 📦 Platform İndirme Bağlantıları

            | Platform | Dosya | Açıklama |
            |---|---|---|
            | **Windows** | `*_x64-setup.exe` | NSIS Kurulum Sihirbazı (Önerilen) |
            | **macOS** | `*_universal.dmg` | macOS Universal (Apple Silicon & Intel) |
            | **Linux** | `*.deb` | Debian / Ubuntu Paketi |
            | **Linux** | `*.AppImage` | Taşınabilir Linux Uygulaması |

            ### ⚙️ Hızlı Tesseract Kurulumu
            Windows kullanıcıları için tek komutla kurulum:
            ```powershell
            winget install UB-Mannheim.TesseractOCR
            ```

            ---
            *Detaylı sürüm geçmişi için [CHANGELOG.md](https://github.com/eekilinc/Ocr-Capture/blob/main/CHANGELOG.md) dosyasını inceleyebilirsiniz.*
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
